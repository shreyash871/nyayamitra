services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nyaya_postgres
    environment:
      POSTGRES_USER: nyaya
      POSTGRES_PASSWORD: nyaya_dev_password
      POSTGRES_DB: nyayamitra
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nyaya -d nyayamitra"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: nyaya_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: nyaya
      MONGO_INITDB_ROOT_PASSWORD: nyaya_dev_password
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: nyaya_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  mongo_data:
  redis_data:
